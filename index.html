<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉字闯关 · Chinese Characters Quest</title>
<style>
:root{
  --bg:#faf5ec; --card:#ffffff; --ink:#2d2a26; --muted:#7a7268; --line:#e8dfd0;
  --accent:#c8402a; --accent-soft:#fbe6e1; --gold:#f2b84b; --ok:#2e9e6b; --ok-soft:#dff4ea;
  --bad:#d64545; --bad-soft:#fde4e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;}
.wrap{max-width:660px;margin:0 auto;padding:16px 16px 48px}
h1{margin:8px 0 2px;font-size:30px;letter-spacing:2px}
h2{margin:0 0 6px;font-size:20px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px;line-height:1.5}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 14px rgba(80,50,20,.08);margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--accent);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;font-size:16px;box-shadow:0 3px 0 #9c2f1d}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c2f1d}
.btn.alt{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;font-size:14px}
.ghost:hover{background:rgba(0,0,0,.05)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.spacer{height:10px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:#efe6d6;color:var(--muted)}
.chip.on{background:var(--accent);color:#fff}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.bar{height:8px;background:#eadfcb;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}

/* home */
.hero{text-align:center;padding:10px 0 6px}
.hero .big{font-size:56px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;color:var(--accent);line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvl{background:#fff;border-radius:16px;padding:14px;text-align:left;box-shadow:0 2px 10px rgba(80,50,20,.08);border:2px solid transparent}
.lvl:hover:not([disabled]){border-color:var(--accent)}
.lvl.locked{opacity:.5;cursor:not-allowed}
.lvl-n{font-weight:700;margin-bottom:4px}
.lvl-w{font-size:15px;color:var(--ink);line-height:1.5;min-height:46px}
.lvl-s{margin-top:6px;color:var(--gold);letter-spacing:2px;font-size:18px}
.toggles{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;font-size:14px;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.foot{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px}
.foot a,.linkbtn{color:var(--muted);text-decoration:underline;background:none;padding:0;font-size:12px}

/* shared word display */
.wordbig{font-family:"Kaiti SC","KaiTi","STKaiti",serif;font-size:44px;line-height:1.2;text-align:center;margin:6px 0;word-break:break-all}
.wordbig.long{font-size:28px}
.py{text-align:center;color:var(--accent);font-size:18px;margin-bottom:4px}
.mean{color:var(--muted);text-align:center;font-size:15px;line-height:1.5}
.reveal{background:var(--ok-soft);border-radius:14px;padding:14px;margin-top:14px;text-align:center}
.reveal .wordbig{font-size:34px}
.reveal .wordbig.long{font-size:22px}
.reveal .sent{margin-top:8px;font-size:17px;line-height:1.7}
.hint{background:#fff7e0;border-radius:12px;padding:10px 12px;margin:10px 0;text-align:center;font-size:15px;line-height:1.5}
.hint[hidden]{display:none}

/* stage 1 */
.speaker{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
.round{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 4px 0 #9c2f1d}
.round.slow{background:#e48a2a;box-shadow:0 4px 0 #b36a17}
.round:active{transform:translateY(2px)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.slot{width:46px;height:54px;border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;
  font-family:"Kaiti SC","KaiTi","STKaiti",serif}
.slot.ok{border-color:var(--ok);color:var(--ok)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:56px;height:56px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:28px;
  font-family:"Kaiti SC","KaiTi","STKaiti",serif;box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.used{opacity:.25;pointer-events:none}

/* stage 2 */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.mbtn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;line-height:1.45;font-size:14px;min-height:52px}
.mbtn.word{font-size:20px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;text-align:center;display:flex;align-items:center;justify-content:center}
.mbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);pointer-events:none}

/* stage 3 */
.mic{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;box-shadow:0 5px 0 #9c2f1d}
.mic.rec{animation:pulse 1s infinite;background:#d62f2f}
.status{min-height:26px;text-align:center;margin:12px 0;font-size:15px}
.status.ok{color:var(--ok);font-weight:600}
.status.bad{color:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,47,47,.5)}100%{box-shadow:0 0 0 22px rgba(214,47,47,0)}}

/* stage 4 */
.ans{min-height:70px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ans.good{border-color:var(--ok);background:var(--ok-soft)}
.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:50px}
.piece{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-size:20px;box-shadow:0 3px 0 var(--line)}
.piece.key{border-color:var(--gold);background:#fff7e0}
.piece:active{transform:translateY(2px);box-shadow:none}

/* quiz */
.qtype{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:99px;margin-bottom:10px;font-weight:600}
.prompt{font-size:20px;line-height:1.8;margin-bottom:16px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);vertical-align:baseline;margin:0 4px}
.fill{color:var(--accent);font-weight:700;border-bottom:3px solid var(--accent)}
.fill.ok{color:var(--ok);border-color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:22px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;box-shadow:0 3px 0 var(--line);word-break:break-all}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.long{font-size:15px}
.inp{width:100%;font-size:26px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;outline:none}
.inp:focus{border-color:var(--accent)}
.stars{font-size:40px;color:var(--gold);letter-spacing:6px;text-align:center}
.score{font-size:48px;font-weight:800;text-align:center}
.miss{background:#fff7e0;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px;line-height:1.5}

.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (max-width:420px){.tile{width:50px;height:50px;font-size:25px}.slot{width:40px}.wordbig{font-size:38px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================
   WORD LIST — edit / extend here.
   w = word, py = pinyin, m = short Chinese meaning,
   s = two example sentences; "____" marks where the word goes.
   Levels are made automatically: every 5 words = 1 level + checkpoint.
   ===================================================================== */
const WORDS = [
 {w:"油漆", py:"yóu qī", m:"涂在物体表面起保护和装饰作用的涂料", s:["工人把____刷在栏杆上，栏杆立刻变得又亮又光滑。","新刷的____还没干，小心别碰到墙上。"]},
 {w:"栏杆", py:"lán gān", m:"起拦挡作用的横向构件，多设在边缘处", s:["他扶着桥边的____往下看，脚下就是深深的河水。","阳台的____很结实，孩子靠在上面很安全。"]},
 {w:"宿舍", py:"sù shè", m:"供学生或职工住宿的房屋", s:["我们学校有六栋____，学生都住在里面。","晚上十点以后，____里就安静下来了。"]},
 {w:"凭", py:"píng", m:"依靠、根据", s:["他____自己的努力考上了大学。","你____什么说这件事是他做的？"]},
 {w:"欣慰", py:"xīn wèi", m:"心里感到宽慰、高兴", s:["看到孩子这么懂事，妈妈脸上露出____的笑容。","学生取得好成绩，老师感到很____。"]},
 {w:"订购", py:"dìng gòu", m:"预先约定购买", s:["我们在网上____了两张火车票。","学校向书店____了一批新教材。"]},
 {w:"塔台", py:"tǎ tái", m:"机场上指挥飞机起降的高塔形建筑", s:["飞机起飞前，飞行员要和____联系。","从____上可以清楚地看到整个机场。"]},
 {w:"范围", py:"fàn wéi", m:"周围界限；活动所及的区域", s:["这次考试的内容____很广，要好好复习。","请把活动____限定在操场以内。"]},
 {w:"特殊", py:"tè shū", m:"不同于一般的；特别的", s:["今天是个____的日子，我们全家都很高兴。","他的情况比较____，需要单独处理。"]},
 {w:"警惕", py:"jǐng tì", m:"对可能的危险保持警觉", s:["夜里走路要提高____，注意安全。","看到陌生人靠近，小狗立刻____起来。"]},
 {w:"失误", py:"shī wù", m:"因疏忽而造成的差错", s:["这次比赛他因为一个____输掉了冠军。","工作中出现____要及时改正。"]},
 {w:"不堪设想", py:"bù kān shè xiǎng", m:"结果严重得不敢想象", s:["如果大火没有被及时发现，后果____。","这么高的楼没有护栏，掉下去____。"]},
 {w:"脂肪", py:"zhī fáng", m:"动植物体内的一种油脂", s:["这种食物____含量高，吃多了容易发胖。","运动可以帮助身体消耗多余的____。"]},
 {w:"截至", py:"jié zhì", m:"到某个时间为止", s:["____今天，报名人数已经超过五百。","____月底，工程完成了大半。"]},
 {w:"行驶", py:"xíng shǐ", m:"车辆等在路上行进", s:["汽车在高速公路上____了三个小时。","雨天路滑，车辆要减速____。"]},
 {w:"延误", py:"yán wù", m:"因故推迟、耽误", s:["因为大雾，好几个航班都____了。","这场暴雨____了工程的进度。"]},
 {w:"稳定", py:"wěn dìng", m:"平稳安定，不易变化", s:["经过治疗，他的病情已经____了。","这份工作收入____，他很满意。"]},
 {w:"幕后", py:"mù hòu", m:"背后；不公开出面的一方", s:["这场演出成功的____有很多人在默默付出。","他是这次活动的____策划者。"]},
 {w:"贡献", py:"gòng xiàn", m:"拿出力量或财物为他人、社会做事", s:["他为国家的科学事业做出了巨大____。","每个人都应该为保护环境做出自己的____。"]},
 {w:"明知山有虎，偏向虎山行", py:"míng zhī shān yǒu hǔ，piān xiàng hǔ shān xíng", m:"明知有危险仍勇敢去做", s:["他知道这项任务很难，还是接了，真是____。","面对困难，他____，决不退缩。"]},
 {w:"漏液", py:"lòu yè", m:"液体从容器中渗漏出来", s:["电池____了，把遥控器都弄坏了。","发现管道____，工人马上进行了修理。"]},
 {w:"轨道", py:"guǐ dào", m:"火车等行驶的路线；物体运动的路径", s:["火车沿着____飞快地向前驶去。","卫星进入了预定的____。"]},
 {w:"凌晨", py:"líng chén", m:"天快亮的时候", s:["他每天____四点就起床锻炼。","事故发生在昨天____三点左右。"]},
 {w:"就绪", py:"jiù xù", m:"准备工作已完成", s:["一切准备____，比赛马上开始。","发射前的各项工作已经____。"]},
 {w:"隧道", py:"suì dào", m:"穿山或穿地而建的通道", s:["火车穿过长长的____，眼前突然一亮。","这条____把山两边的城市连了起来。"]},
 {w:"扫描", py:"sǎo miáo", m:"用仪器逐一检查或读取", s:["进站前，行李要经过机器____。","医生用仪器____了他的头部。"]},
 {w:"裂痕", py:"liè hén", m:"物体上裂开的痕迹", s:["墙上出现了一道____，要赶紧修。","杯子有了____，不能再用了。"]},
 {w:"顺畅", py:"shùn chàng", m:"顺利通畅，没有阻碍", s:["今天的网络很____，视频一点也不卡。","道路修好后，交通变得很____。"]},
 {w:"全力以赴", py:"quán lì yǐ fù", m:"用全部力量去做", s:["比赛时他____，终于拿到了第一名。","面对这次考试，我们要____。"]},
 {w:"职业", py:"zhí yè", m:"个人从事的工作", s:["他的____是一名医生。","选择____要考虑自己的兴趣。"]},
 {w:"故障", py:"gù zhàng", m:"机器等发生的毛病", s:["电梯出了____，我们只好走楼梯。","技术人员很快排除了机器的____。"]},
 {w:"岗位", py:"gǎng wèi", m:"工作的职位或位置", s:["他在这个____上工作了二十年。","节日期间，很多人在自己的____上坚守。"]},
 {w:"新谣", py:"xīn yáo", m:"新加坡华语创作歌曲的一种", s:["这场演唱会唱的都是本地____。","他很喜欢听____，旋律很好听。"]},
 {w:"芝麻", py:"zhī ma", m:"一种小粒的油料作物，也指其种子", s:["汤圆里包着____馅，又香又甜。","别为了这点____大的事生气。"]},
 {w:"朗朗上口", py:"lǎng lǎng shàng kǒu", m:"读起来顺口、好听", s:["这首儿歌节奏明快，____。","广告词写得____，大家一下就记住了。"]},
 {w:"奉献", py:"fèng xiàn", m:"无私地付出", s:["他把一生都____给了教育事业。","这些志愿者默默____着自己的时间。"]},
 {w:"繁荣", py:"fán róng", m:"经济或事业蓬勃发展", s:["这座城市越来越____，高楼越来越多。","我们希望国家更加____富强。"]},
 {w:"平凡", py:"píng fán", m:"普通、不特别", s:["他做着最____的工作，却从不抱怨。","正是这些____的人撑起了社会。"]},
 {w:"光芒", py:"guāng máng", m:"向四面放射的光线", s:["太阳的____照在大地上，暖洋洋的。","舞台上，她身上仿佛散发着____。"]}
];
/* ===================================================================== */

const PER_LEVEL = 5;          // words per level
const PASS_RATE = 0.7;        // checkpoint pass mark
const EXTRA_REVIEW = 3;       // older words mixed into each checkpoint

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const han = s => s.replace(/[^\u4e00-\u9fff]/g,'');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortWord = w => w.length>8 ? w.slice(0,5)+'…' : w;
const longCls = w => han(w).length>5 ? ' long' : '';
const splitS = s => { const i=s.indexOf('____'); return [s.slice(0,i), s.slice(i+4)]; };
const shake = el => { if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
function lcs(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[m][n];}

const LEVELS = []; for(let i=0;i<WORDS.length;i+=PER_LEVEL) LEVELS.push(WORDS.slice(i,i+PER_LEVEL));
const ALLCHARS = [...new Set(WORDS.flatMap(w=>Array.from(han(w.w))))];

/* ---------- saved progress ---------- */
const KEY = 'hanzi-quest-v1';
let save = {unlocked:1, stars:{}, points:0, showPinyin:false, sound:true};
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY)||'{}')); } catch(e){}
const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} };

/* ---------- speech & sound ---------- */
const hasTTS = 'speechSynthesis' in window;
let zhVoice = null;
function loadVoices(){
  if(!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate=0.85){
  if(!hasTTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; if(zhVoice) u.voice = zhVoice; u.rate = rate;
  speechSynthesis.speak(u);
}
let actx;
function beep(ok){
  if(!save.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value = ok?880:220; g.gain.value=0.07;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(ok?0.12:0.2));
  }catch(e){}
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------- game state ---------- */
let G = null;
const STAGES = ['1 Listen','2 Match','3 Speak','4 Order','✓ Quiz'];

function topbar(){
  let frac = G.stage===1 ? 0 : G.stage===4 ? G.qi/(G.qs?G.qs.length:1) : G.i/G.words.length;
  const pct = Math.min(100,((G.stage+frac)/5)*100);
  return `<div class="top">
    <button class="ghost" id="homeBtn">← Levels</button>
    <div class="chips">${STAGES.map((s,i)=>`<span class="chip ${i===G.stage?'on':i<G.stage?'done':''}">${s}</span>`).join('')}</div>
  </div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="meta"><span>Level ${G.level+1}</span><span>⭐ ${save.points + G.pts + G.qpts}</span></div>`;
}
function bindTop(){
  const b = document.getElementById('homeBtn');
  if(b) b.onclick = ()=>{ if(confirm('Leave this level? Progress in this level will be lost.')) renderHome(); };
}
function draw(html){ app.innerHTML = html; bindTop(); window.scrollTo(0,0); }

/* =====================  HOME  ===================== */
function renderHome(){
  G = null; if(hasTTS) speechSynthesis.cancel();
  const cards = LEVELS.map((ws,i)=>{
    const locked = i>=save.unlocked, st = save.stars[i]||0;
    return `<button class="lvl ${locked?'locked':''}" data-i="${i}" ${locked?'disabled':''}>
      <div class="lvl-n">Level ${i+1}</div>
      <div class="lvl-w">${ws.map(w=>esc(shortWord(w.w))).join(' · ')}</div>
      <div class="lvl-s">${locked?'🔒':'★'.repeat(st)+'☆'.repeat(3-st)}</div></button>`;
  }).join('');
  app.innerHTML = `
    <div class="hero"><div class="big">汉字闯关</div><h1 style="font-size:18px;letter-spacing:1px;color:var(--muted);font-weight:500">Chinese Characters Quest</h1></div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b>⭐ ${save.points}</b> points · ${Math.min(save.unlocked-1,LEVELS.length)}/${LEVELS.length} levels cleared</div>
        <button class="btn alt" id="testVoice" style="padding:8px 16px;font-size:14px">🔊 Test voice</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="optPy" ${save.showPinyin?'checked':''}> Show pinyin hints by default</label>
        <label><input type="checkbox" id="optSnd" ${save.sound?'checked':''}> Sound effects</label>
      </div>
      <p class="sub" style="margin:0">Each level = ${PER_LEVEL} new words → Listen → Match → Speak → Order → Checkpoint quiz. Pass the quiz (≥${Math.round(PASS_RATE*100)}%) to unlock the next level.</p>
    </div>
    <div class="grid">${cards}</div>
    <div class="foot">
      Audio uses your browser's Chinese voice (if you hear nothing, install a zh-CN voice in your device's text-to-speech settings).
      Speaking stage uses speech recognition (best in Chrome / Edge / Safari; a self-check option is always available).<br>
      <button class="linkbtn" id="unlockAll">Unlock all levels</button> · <button class="linkbtn" id="resetAll">Reset progress</button>
    </div>`;
  app.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>startLevel(+b.dataset.i));
  document.getElementById('testVoice').onclick = ()=>speak('你好，欢迎来到汉字闯关！');
  document.getElementById('optPy').onchange = e=>{save.showPinyin=e.target.checked;persist();};
  document.getElementById('optSnd').onchange = e=>{save.sound=e.target.checked;persist();};
  document.getElementById('unlockAll').onclick = ()=>{save.unlocked=LEVELS.length;persist();renderHome();};
  document.getElementById('resetAll').onclick = ()=>{ if(confirm('Reset all progress?')){save={unlocked:1,stars:{},points:0,showPinyin:save.showPinyin,sound:save.sound};persist();renderHome();} };
  window.scrollTo(0,0);
}

function startLevel(i){
  G = {level:i, words:LEVELS[i], stage:0, i:0, pts:0, qpts:0, qi:0, qs:null};
  runStage();
}
function runStage(){ [stage1,stage2,stage3,stage4,quiz][G.stage](); }
function nextItem(){ G.i++; if(G.i<G.words.length) runStage(); else advanceStage(); }
function advanceStage(){ G.stage++; G.i=0; runStage(); }

/* =====================  STAGE 1: LISTEN & PICK CHARACTERS  ===================== */
function stage1(){
  const word = G.words[G.i], chars = Array.from(han(word.w));
  const distract = shuffle(ALLCHARS.filter(c=>!chars.includes(c))).slice(0,4);
  const pool = shuffle([...chars, ...distract]);
  let pos = 0, mis = 0, done = false;

  draw(topbar() + `
    <div class="card">
      <h2>Listen, then pick the characters in order</h2>
      <p class="sub">Word ${G.i+1} of ${G.words.length}. Tap the characters in the correct sequence.</p>
      <div class="speaker">
        <button class="round" id="play" title="Play">🔊</button>
        <button class="round slow" id="slow" title="Slow">🐢</button>
      </div>
      <div class="slots" id="slots">${chars.map(()=>`<div class="slot"></div>`).join('')}</div>
      <div class="tiles" id="tiles">${pool.map((c,k)=>`<button class="tile" data-k="${k}">${c}</button>`).join('')}</div>
      <div class="hint" id="hint" ${save.showPinyin?'':'hidden'}>${esc(word.py)} · ${esc(word.m)}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" id="hintBtn">💡 Hint (pinyin + meaning)</button></div>
      <div id="after"></div>
    </div>`);

  const slots = app.querySelectorAll('.slot');
  document.getElementById('play').onclick = ()=>speak(word.w, 0.9);
  document.getElementById('slow').onclick = ()=>speak(word.w, 0.5);
  document.getElementById('hintBtn').onclick = ()=>{ const h=document.getElementById('hint'); h.hidden=!h.hidden; };
  setTimeout(()=>speak(word.w,0.9), 250);

  app.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    if(done) return;
    const c = pool[+t.dataset.k];
    if(c === chars[pos]){
      t.classList.add('used'); slots[pos].textContent = c; slots[pos].classList.add('ok'); pos++; beep(true);
      if(pos === chars.length){ done = true; G.pts += Math.max(2, 10-2*mis); finish(); }
    } else { mis++; beep(false); shake(t); }
  });

  function finish(){
    speak(word.w, 0.9);
    document.getElementById('after').innerHTML = `
      <div class="reveal"><div class="wordbig${longCls(word.w)}">${esc(word.w)}</div><div class="py">${esc(word.py)}</div><div class="mean">${esc(word.m)}</div></div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="next">Next →</button></div>`;
    document.getElementById('next').onclick = nextItem;
  }
}

/* =====================  STAGE 2: MATCH WORD ↔ MEANING  ===================== */
function stage2(){
  const ws = G.words, right = shuffle(ws.map((w,i)=>i));
  let selL=null, selR=null, matched=0, pen=0;
  draw(topbar() + `
    <div class="card">
      <h2>Match each word to its meaning</h2>
      <p class="sub">Tap a word, then tap the meaning that fits.</p>
      <div class="match">
        <div class="col">${ws.map((w,i)=>`<button class="mbtn word" data-i="${i}">${esc(w.w)}</button>`).join('')}</div>
        <div class="col">${right.map(i=>`<button class="mbtn mean" data-i="${i}">${esc(ws[i].m)}</button>`).join('')}</div>
      </div>
      <div id="after"></div>
    </div>`);
  app.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done')) return;
    const isL = b.classList.contains('word');
    app.querySelectorAll('.mbtn.'+(isL?'word':'mean')+'.sel').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    if(isL) selL=b; else selR=b;
    if(selL && selR){
      const L=selL, R=selR; selL=selR=null;
      if(L.dataset.i === R.dataset.i){
        [L,R].forEach(x=>{x.classList.remove('sel');x.classList.add('done');});
        beep(true); speak(ws[+L.dataset.i].w, 0.9);
        G.pts += Math.max(2, 10-2*pen); pen=0; matched++;
        if(matched === ws.length){
          document.getElementById('after').innerHTML = `<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="next">Continue →</button></div>`;
          document.getElementById('next').onclick = advanceStage;
        }
      } else {
        pen++; beep(false); shake(L); shake(R);
        setTimeout(()=>{L.classList.remove('sel');R.classList.remove('sel');},350);
      }
    }
  });
}

/* =====================  STAGE 3: SPEAK THE WORD  ===================== */
function stage3(){
  const word = G.words[G.i], target = han(word.w);
  let tries = 0, done = false, busy = false;
  draw(topbar() + `
    <div class="card center">
      <h2>Say the word out loud</h2>
      <p class="sub">Word ${G.i+1} of ${G.words.length}. Listen first if you like, then tap the microphone and read it.</p>
      <div class="wordbig${longCls(word.w)}">${esc(word.w)}</div>
      <div class="py">${esc(word.py)}</div>
      <div class="mean">${esc(word.m)}</div>
      <div class="row" style="justify-content:center;margin:18px 0 6px;gap:18px">
        <button class="round" id="play" title="Listen">🔊</button>
        ${SR ? `<button class="mic" id="mic" title="Speak">🎤</button>` : ''}
      </div>
      <div class="status" id="status">${SR ? 'Tap 🎤 and say the word.' : 'Speech recognition is not available in this browser — listen, say it aloud, then self-check.'}</div>
      <div class="row" style="justify-content:center" id="actions">
        <button class="ghost" id="self" ${SR?'hidden':''}>✅ I said it correctly (self-check)</button>
      </div>
    </div>`);
  const status = (t,c='') => { const s=document.getElementById('status'); s.textContent=t; s.className='status '+c; };
  document.getElementById('play').onclick = ()=>speak(word.w, 0.85);
  setTimeout(()=>speak(word.w,0.85), 250);

  function pass(auto){
    if(done) return; done = true;
    beep(true); G.pts += auto ? 10 : 6;
    status(auto ? '🎉 Great pronunciation!' : '👍 Marked as done.', 'ok');
    document.getElementById('actions').innerHTML = `<button class="btn" id="next">Next →</button>`;
    document.getElementById('next').onclick = nextItem;
    const m=document.getElementById('mic'); if(m) m.disabled=true;
    const s=document.getElementById('self'); if(s) s.hidden=true;
  }
  document.getElementById('self').onclick = ()=>pass(false);

  const mic = document.getElementById('mic');
  if(mic) mic.onclick = ()=>{
    if(busy || done) return;
    if(hasTTS) speechSynthesis.cancel();
    const r = new SR(); r.lang='zh-CN'; r.interimResults=false; r.maxAlternatives=5;
    let got=false, err=null; busy=true; mic.classList.add('rec'); status('🎙 Listening… say the word now');
    r.onresult = e=>{
      got=true;
      const alts = Array.from(e.results[0]).map(a=>a.transcript);
      const ok = alts.some(a=>{ const h=han(a); return h.includes(target) || (target.length>=4 && lcs(h,target)/target.length>=0.75); });
      if(ok) pass(true);
      else { tries++; beep(false); status(`Heard: “${alts[0]}” — try again.`,'bad'); document.getElementById('self').hidden=false; }
    };
    r.onerror = e=>{ err=e.error; };
    r.onend = ()=>{
      busy=false; mic.classList.remove('rec');
      if(!got && !done){
        status(err==='not-allowed'||err==='service-not-allowed' ? 'Microphone blocked — allow it in your browser, or use self-check.' : 'Didn’t catch that — try again.','bad');
        document.getElementById('self').hidden=false;
      }
    };
    try{ r.start(); }catch(e){ busy=false; mic.classList.remove('rec'); }
  };
}

/* =====================  STAGE 4: REARRANGE THE SENTENCE  ===================== */
function makeChunks(a, w, b){
  const P = /^[，。？！、；：]+/;
  let wt = w; const m = b.match(P); if(m){ wt += m[0]; b = b.slice(m[0].length); }
  const seg = t=>{
    if(!t) return [];
    let parts;
    if(window.Intl && Intl.Segmenter){ parts=[...new Intl.Segmenter('zh',{granularity:'word'}).segment(t)].map(x=>x.segment); }
    else parts = Array.from(t);
    const out=[];
    for(const p of parts){ if(/^[，。？！、；：]+$/.test(p) && out.length) out[out.length-1]+=p; else out.push(p); }
    return out;
  };
  let chunks = [...seg(a).map(t=>({t})), {t:wt, word:true}, ...seg(b).map(t=>({t}))];
  while(chunks.length > 8){
    let best=-1, bl=1e9;
    for(let i=0;i<chunks.length-1;i++){
      if(chunks[i].word || chunks[i+1].word) continue;
      const l = chunks[i].t.length + chunks[i+1].t.length;
      if(l<bl){bl=l;best=i;}
    }
    if(best<0) break;
    chunks.splice(best,2,{t:chunks[best].t+chunks[best+1].t});
  }
  return chunks.map((c,i)=>({...c,id:i}));
}
function stage4(){
  const word = G.words[G.i];
  const s = word.s[rand(word.s.length)], [a,b] = splitS(s), full = a + word.w + b;
  const chunks = makeChunks(a, word.w, b);
  let bank = shuffle(chunks);
  if(chunks.length>1){ let n=0; while(bank.map(x=>x.t).join('')===full && n++<20) bank=shuffle(chunks); }
  let ans = [], wrong = 0, done = false;

  draw(topbar() + `
    <div class="card">
      <h2>Rearrange the words into a sentence</h2>
      <p class="sub">Sentence ${G.i+1} of ${G.words.length}. Tap pieces to build the sentence; tap a placed piece to take it back. <b>Gold</b> = the target word.</p>
      <div class="ans" id="ans"></div>
      <div class="bank" id="bank"></div>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn alt" id="reset">Reset</button>
        <button class="btn" id="check">Check ✓</button>
      </div>
      <div class="status" id="status"></div>
      <div id="after"></div>
    </div>`);
  const ansEl = document.getElementById('ans'), bankEl = document.getElementById('bank');
  const pieceHTML = c=>`<button class="piece ${c.word?'key':''}" data-id="${c.id}">${esc(c.t)}</button>`;
  function paint(){
    ansEl.innerHTML = ans.map(pieceHTML).join('') || '<span class="sub" style="margin:0">Your sentence appears here…</span>';
    bankEl.innerHTML = bank.map(pieceHTML).join('');
    ansEl.className = 'ans';
  }
  paint();
  bankEl.onclick = e=>{ const p=e.target.closest('.piece'); if(!p||done) return; const i=bank.findIndex(c=>c.id===+p.dataset.id); ans.push(bank.splice(i,1)[0]); paint(); };
  ansEl.onclick  = e=>{ const p=e.target.closest('.piece'); if(!p||done) return; const i=ans.findIndex(c=>c.id===+p.dataset.id); bank.push(ans.splice(i,1)[0]); paint(); };
  document.getElementById('reset').onclick = ()=>{ if(done) return; bank=shuffle(chunks); ans=[]; paint(); document.getElementById('status').textContent=''; };
  document.getElementById('check').onclick = ()=>{
    if(done) return;
    const st = document.getElementById('status');
    if(bank.length){ st.textContent='Use all the pieces first.'; st.className='status bad'; return; }
    if(ans.map(c=>c.t).join('') === full){
      done = true; beep(true); ansEl.classList.add('good'); G.pts += Math.max(2, 12-3*wrong);
      st.textContent='🎉 Correct!'; st.className='status ok'; showDone(true);
    } else {
      wrong++; beep(false); shake(ansEl); ansEl.classList.add('bad');
      st.textContent = wrong>=3 ? 'Not quite — here is the answer.' : 'Not quite — try rearranging.'; st.className='status bad';
      if(wrong>=3){ done=true; showDone(false); }
    }
  };
  function showDone(ok){
    speak(full, 0.9);
    const [x,y] = splitS(s);
    document.getElementById('after').innerHTML = `
      <div class="reveal"><div class="sent">${esc(x)}<span class="fill ok">${esc(word.w)}</span>${esc(y)}</div></div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="next">${G.i+1<G.words.length?'Next →':'Go to checkpoint quiz →'}</button></div>`;
    document.getElementById('next').onclick = nextItem;
  }
}

/* =====================  CHECKPOINT QUIZ  ===================== */
function optionsFor(word){
  const len = han(word.w).length;
  const same = shuffle(WORDS.filter(x=>x!==word && han(x.w).length===len));
  const others = shuffle(WORDS.filter(x=>x!==word && han(x.w).length!==len))
    .sort((p,q)=>Math.abs(han(p.w).length-len)-Math.abs(han(q.w).length-len));
  return shuffle([word, ...[...same,...others].slice(0,3)]);
}
function buildQuiz(){
  const earlier = WORDS.slice(0, G.level*PER_LEVEL);
  const extra = shuffle(earlier).slice(0, Math.min(EXTRA_REVIEW, earlier.length));
  const ws = shuffle([...G.words, ...extra]);
  const types = []; while(types.length < ws.length) types.push(...shuffle(['cloze','meaning','write']));
  return ws.map((w,i)=>({w, type:types[i], s:w.s[rand(w.s.length)], opts:optionsFor(w), ok:null}));
}
function quiz(){
  if(!G.qs){ G.qs = buildQuiz(); G.qi = 0; G.qpts = 0; }
  if(G.qi >= G.qs.length) return quizResult();
  const q = G.qs[G.qi], w = q.w;
  const labels = {cloze:'Fill in the blank', meaning:'Pick the word for this meaning', write:'Write the word'};
  let head = `<div class="qtype">Checkpoint · Q${G.qi+1}/${G.qs.length} · ${labels[q.type]}</div>`;
  let body = '';
  const [x,y] = splitS(q.s);
  if(q.type==='cloze'){
    body = `<div class="prompt">${esc(x)}<span class="blank"></span>${esc(y)}</div>
            <div class="opts">${q.opts.map((o,i)=>`<button class="opt${han(o.w).length>6?' long':''}" data-i="${i}">${esc(o.w)}</button>`).join('')}</div>`;
  } else if(q.type==='meaning'){
    body = `<div class="prompt">哪一个词的意思是：<br><b>${esc(w.m)}</b></div>
            <div class="opts">${q.opts.map((o,i)=>`<button class="opt${han(o.w).length>6?' long':''}" data-i="${i}">${esc(o.w)}</button>`).join('')}</div>`;
  } else {
    body = `<div class="prompt">请写出这个词：<br><b>${esc(w.m)}</b></div>
            <input class="inp" id="inp" type="text" lang="zh-CN" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入…">
            <div class="hint" id="hint" hidden>${esc(w.py)}</div>
            <div class="row" style="margin-top:12px;justify-content:center">
              <button class="btn alt" id="hintBtn" style="font-size:14px;padding:8px 16px">💡 Pinyin hint</button>
              <button class="btn" id="submit">Submit</button>
            </div>`;
  }
  draw(topbar() + `<div class="card">${head}${body}<div id="after"></div></div>`);

  const record = ok => {
    q.ok = ok; beep(ok); if(ok) G.qpts += 15;
    speak(w.w, 0.9);
    const filled = q.type==='cloze' ? `<div class="sent">${esc(x)}<span class="fill ok">${esc(w.w)}</span>${esc(y)}</div>` : '';
    document.getElementById('after').innerHTML = `
      <div class="reveal" style="${ok?'':'background:var(--bad-soft)'}">
        <div style="font-weight:700;margin-bottom:6px">${ok?'✅ Correct!':'❌ The answer is:'}</div>
        <div class="wordbig${longCls(w.w)}">${esc(w.w)}</div><div class="py">${esc(w.py)}</div><div class="mean">${esc(w.m)}</div>${filled}
      </div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="next">${G.qi+1<G.qs.length?'Next →':'See results →'}</button></div>`;
    document.getElementById('next').onclick = ()=>{ G.qi++; quiz(); };
  };

  if(q.type==='write'){
    const inp = document.getElementById('inp'); inp.focus();
    let locked=false;
    const submit = ()=>{
      if(locked) return;
      if(!han(inp.value)){ shake(inp); return; }
      locked=true; inp.disabled=true;
      const ok = han(inp.value) === han(w.w);
      inp.style.borderColor = ok?'var(--ok)':'var(--bad)';
      document.getElementById('submit').disabled = true; document.getElementById('hintBtn').disabled = true;
      record(ok);
    };
    document.getElementById('submit').onclick = submit;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing) submit(); });
    document.getElementById('hintBtn').onclick = ()=>{ const h=document.getElementById('hint'); h.hidden=!h.hidden; };
  } else {
    let locked=false;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked) return; locked=true;
      const ok = q.opts[+b.dataset.i] === w;
      app.querySelectorAll('.opt').forEach(o=>{ if(q.opts[+o.dataset.i]===w) o.classList.add('right'); });
      if(!ok){ b.classList.add('wrong'); shake(b); }
      record(ok);
    });
  }
}

function quizResult(){
  const total = G.qs.length, right = G.qs.filter(q=>q.ok).length, rate = right/total;
  const pass = rate >= PASS_RATE;
  const stars = !pass ? 0 : right===total ? 3 : rate>=0.85 ? 2 : 1;
  const missed = G.qs.filter(q=>!q.ok);
  let isLast = G.level === LEVELS.length-1;
  if(pass){
    save.points += G.pts + G.qpts;
    save.stars[G.level] = Math.max(save.stars[G.level]||0, stars);
    save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, G.level+2));
    persist();
  }
  G.stage = 4; G.qi = total;
  draw(topbar() + `
    <div class="card">
      <div class="center">
        <h2>${pass ? (isLast?'🏆 You finished every level!':'🎉 Level cleared!') : 'Almost there!'}</h2>
        <div class="score">${right}/${total}</div>
        ${pass ? `<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>` : `<p class="sub">You need ${Math.ceil(PASS_RATE*total)} correct to pass the checkpoint.</p>`}
      </div>
      ${missed.length ? `<h2 style="font-size:16px;margin-top:14px">Words to review</h2>${missed.map(q=>`<div class="miss"><b>${esc(q.w.w)}</b>（${esc(q.w.py)}）— ${esc(q.w.m)}</div>`).join('')}` : '<p class="center sub">Perfect — no mistakes!</p>'}
      <div class="row" style="justify-content:center;margin-top:18px">
        ${pass ? (isLast ? '' : `<button class="btn" id="nextLvl">Next level →</button>`) : `<button class="btn" id="retry">Retry checkpoint</button><button class="btn alt" id="replay">Replay level</button>`}
        <button class="btn alt" id="levels">All levels</button>
      </div>
    </div>`);
  const $ = id=>document.getElementById(id);
  if($('nextLvl')) $('nextLvl').onclick = ()=>startLevel(G.level+1);
  if($('retry')) $('retry').onclick = ()=>{ G.qs=null; G.stage=4; quiz(); };
  if($('replay')) $('replay').onclick = ()=>startLevel(G.level);
  $('levels').onclick = renderHome;
}

renderHome();
</script>
</body>
</html>
